name: Cost Validate

on:
  push:
    branches:
      - cost/cache-catalog-info-pages

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
