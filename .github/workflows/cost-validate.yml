name: Validate real2free cost optimization

on:
  push:
    branches: [cost/reduce-function-and-prefetch-load]
    paths: [.github/workflows/cost-validate.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
