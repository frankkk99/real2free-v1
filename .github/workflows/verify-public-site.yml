name: Verify REAL2FREE Public Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build
        id: verify
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > build.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run build >> build.log 2>&1
            status=$?
          fi
          cat build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real2free-build-log
          path: build.log
          retention-days: 1
      - name: Fail when verification fails
        if: steps.verify.outputs.status != '0'
        run: exit 1
